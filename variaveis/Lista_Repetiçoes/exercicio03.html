<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Número Perfeito</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-4">
                
                <img src="imagens/exerc.jpg" alt="exerc" class="img-fluid">
            </div>
            <div class="col-8">
                <h1>Número Perfeito</h1>
                
                <form id="formNumero">
                    <p>Digite um número: 
                        <input type="number" id="inNumero" min="1" required class="form-control d-inline-block w-auto">
                    </p>
                    <input type="submit" value="Verificar Número" class="btn btn-primary">
                </form>

                <p>&nbsp;</p>
                <pre id="outResp1"></pre>
                <pre id="outResp2"></pre>
            </div>
        </div>
    </div>
    
  
    <script src="js/exercicio03.js"></script>
</body>
</html>
